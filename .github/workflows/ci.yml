name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Postgres efêmero do runner. Nenhum passo aqui toca o banco de produção:
      # os checks de schema comparam migrations com o datamodel, não com prod.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nuflow_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nuflow_ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuflow_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Tipos
        run: npx tsc --noEmit

      # Falha só em erro. O código anterior ao ESLint gera ~155 avisos: as regras
      # correspondentes estão em "warn" no eslint.config.mjs e voltam a "error"
      # conforme a dívida for paga.
      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      # Impede a 59ª rota sem escopo de organização. A allowlist em
      # scripts/tenancy-allowlist.json guarda a dívida conhecida e só encolhe.
      - name: Isolamento multiempresa (auditor estático)
        run: npm run auditar:tenancy

      - name: Migrations aplicam num banco limpo
        run: npx prisma migrate deploy

      # Depois de aplicar as migrations no banco vazio, ele tem que ficar
      # idêntico ao schema.prisma. Divergência = alguém mexeu no schema sem gerar
      # migration — o mesmo descuido que deixou o banco sem histórico até agora.
      # (Compara banco × schema em vez de migrations × schema: assim não precisa
      # de shadow database, que o CLI do Prisma 7 só aceita via config.)
      - name: Banco migrado é idêntico ao schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Build
        run: npx next build
        env:
          NEXTAUTH_SECRET: ci-secret-nao-usado-em-producao
          NEXTAUTH_URL: http://localhost:3000
